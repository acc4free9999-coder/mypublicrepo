name: FocusGuard
options:
  bundleIdPrefix: com.focusguard
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TARGETED_DEVICE_FAMILY: "1,2"

packages:
  FocusGuardKit:
    path: FocusGuardKit

targets:
  FocusGuard:
    type: application
    platform: iOS
    sources:
      - path: FocusGuard
      - path: Shared
    dependencies:
      - package: FocusGuardKit
      - target: FocusGuardMonitor
      - target: FocusGuardShieldConfiguration
      - target: FocusGuardShieldAction
      - target: FocusGuardReport
    info:
      path: FocusGuard/Resources/Info.plist
      properties:
        CFBundleDisplayName: FocusGuard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: FocusGuard/Resources/FocusGuard.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.focusguard.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.focusguard.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  FocusGuardMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/DeviceActivityMonitor
      - path: Shared/Core
    dependencies:
      - package: FocusGuardKit
    info:
      path: Extensions/DeviceActivityMonitor/Info.plist
      properties:
        CFBundleDisplayName: FocusGuard Monitor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FocusGuardActivityMonitor
    entitlements:
      path: Extensions/DeviceActivityMonitor/FocusGuardMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.focusguard.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.focusguard.app.monitor

  FocusGuardShieldConfiguration:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/ShieldConfiguration
      - path: Shared/Core
    dependencies:
      - package: FocusGuardKit
    info:
      path: Extensions/ShieldConfiguration/Info.plist
      properties:
        CFBundleDisplayName: FocusGuard Shield
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FocusGuardShieldConfiguration
    entitlements:
      path: Extensions/ShieldConfiguration/FocusGuardShieldConfiguration.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.focusguard.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.focusguard.app.shield-configuration

  FocusGuardShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/ShieldAction
      - path: Shared/Core
    dependencies:
      - package: FocusGuardKit
    info:
      path: Extensions/ShieldAction/Info.plist
      properties:
        CFBundleDisplayName: FocusGuard Shield Action
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FocusGuardShieldAction
    entitlements:
      path: Extensions/ShieldAction/FocusGuardShieldAction.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.focusguard.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.focusguard.app.shield-action

  FocusGuardReport:
    type: extensionkit-extension
    platform: iOS
    sources:
      - path: Extensions/DeviceActivityReport
      - path: Shared/Report
    info:
      path: Extensions/DeviceActivityReport/Info.plist
      properties:
        CFBundleDisplayName: FocusGuard Report
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.deviceactivityui.report-extension
    entitlements:
      path: Extensions/DeviceActivityReport/FocusGuardReport.entitlements
      properties:
        com.apple.developer.family-controls: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.focusguard.app.report

  FocusGuardTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FocusGuardTests
    dependencies:
      - target: FocusGuard
      - package: FocusGuardKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.focusguard.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  FocusGuard:
    build:
      targets:
        FocusGuard: all
        FocusGuardTests: [test]
    test:
      targets:
        - FocusGuardTests
        - package: FocusGuardKit/FocusGuardKitTests
    run:
      config: Debug
