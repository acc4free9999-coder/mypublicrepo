<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Droplet Dictionary</title>
  <link rel="stylesheet" href="../lib/card.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="brand"><img src="../icons/icon32.png" alt="" /> Droplet Dictionary</div>
    <a id="settings" href="#" title="Settings">⚙️</a>
  </header>
  <form id="search">
    <input id="q" type="search" placeholder="Type a word or sentence…" autocomplete="off" autofocus />
    <button type="submit">Look up</button>
  </form>
  <div id="result" class="ej-card" hidden></div>
  <section class="stats">
    <div><b id="total">0</b><span>words saved</span></div>
    <div><b id="colls">0</b><span>collections</span></div>
    <div><b id="due">0</b><span>due for review</span></div>
  </section>
  <nav>
    <button id="openNotebook">📒 Notebook</button>
    <button id="openReview" class="primary">🎮 Review now</button>
  </nav>
  <script src="../lib/common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
