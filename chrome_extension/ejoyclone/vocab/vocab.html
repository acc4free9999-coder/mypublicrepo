<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Droplet Dictionary — Notebook</title>
  <link rel="icon" href="../icons/icon32.png" />
  <link rel="stylesheet" href="vocab.css" />
</head>
<body>
  <header>
    <div class="brand"><img src="../icons/icon48.png" alt="" /> Droplet Dictionary</div>
    <nav id="tabs">
      <a href="#notebook" data-tab="notebook">📒 Notebook</a>
      <a href="#review" data-tab="review">🎮 Review</a>
      <a href="#settings" data-tab="settings">⚙️ Settings</a>
    </nav>
  </header>

  <main>
    <!-- Notebook -->
    <section id="notebook" class="tab">
      <div class="nb">
        <aside class="sidebar">
          <div class="side-title">Collections</div>
          <div id="collList"></div>
          <form id="newColl" class="newcoll">
            <input name="name" maxlength="40" placeholder="New collection…" autocomplete="off" />
            <button type="submit" title="Create collection">+</button>
          </form>
        </aside>
        <div class="nb-main">
          <div class="coll-head">
            <h2 id="collTitle"></h2>
            <div id="collActions">
              <button id="reviewColl" class="primary">🎮 Review</button>
              <button id="renameColl">✏️ Rename</button>
              <button id="deleteColl" class="danger-btn">🗑 Delete collection</button>
            </div>
          </div>
          <div class="toolbar">
            <input id="filter" type="search" placeholder="Search your words…" />
            <select id="sort">
              <option value="new">Newest first</option>
              <option value="az">A → Z</option>
              <option value="due">Due soonest</option>
              <option value="weak">Weakest first</option>
            </select>
            <button id="exportCsv">⬇ Export CSV</button>
            <label class="btn">⬆ Import CSV<input id="importCsv" type="file" accept=".csv,text/csv" hidden /></label>
          </div>
          <p class="muted" id="summary"></p>
          <div id="list"></div>
        </div>
      </div>
    </section>

    <!-- Review -->
    <section id="review" class="tab">
      <div id="gameStats" class="gstats"></div>
      <div class="toolbar">
        <label>Collection
          <select id="reviewCollection"></select>
        </label>
        <label>Game
          <select id="mode">
            <option value="mixed">🎲 Mixed (all games)</option>
            <option value="flash">Flashcards</option>
            <option value="choice">Multiple choice (word → meaning)</option>
            <option value="reverse">Multiple choice (meaning → word)</option>
            <option value="type">Fill in the blank</option>
            <option value="listen">Listening</option>
          </select>
        </label>
        <label><input type="checkbox" id="allWords" /> Include words not yet due</label>
        <label title="20 seconds per question; faster answers earn bonus points"><input type="checkbox" id="timed" /> ⏱ Timer</label>
        <button id="soundToggle" type="button" title="Game sounds"></button>
        <button id="start" class="primary">Start</button>
      </div>
      <div id="game"></div>
    </section>

    <!-- Settings -->
    <section id="settings" class="tab">
      <form id="settingsForm" class="settings">
        <label>Translate into
          <select name="targetLang" id="targetLang"></select>
        </label>
        <label><input type="checkbox" name="showIcon" /> Show the droplet icon when I select text</label>
        <label><input type="checkbox" name="dblclickLookup" /> Look up instantly when I double-click a word</label>
        <label><input type="checkbox" name="autoSpeak" /> Pronounce automatically on lookup</label>
        <label><input type="checkbox" name="reminders" /> Show number of due words on the toolbar icon</label>
        <p class="muted" id="savedMsg"></p>
      </form>
      <div class="danger">
        <button id="clearAll">🗑 Delete all saved words</button>
      </div>
    </section>
  </main>

  <script src="../lib/common.js"></script>
  <script src="vocab.js"></script>
  <script src="game.js"></script>
</body>
</html>
