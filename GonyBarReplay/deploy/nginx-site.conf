# Host Nginx site for GonyBarReplay on a VPS (no Docker).
# 1. Replace example.com with your domain (or use your VPS IP as server_name).
# 2. sudo cp deploy/nginx-site.conf /etc/nginx/sites-available/gony-bar-replay
#    sudo ln -s /etc/nginx/sites-available/gony-bar-replay /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
# 3. HTTPS: sudo certbot --nginx -d example.com   (adds the 443 server block automatically)
#
# Using Docker instead? Keep the container on port 8080 and replace the `root`/locations below with:
#     location / { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; }
server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    root /var/www/gony-bar-replay;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/csv application/javascript application/json image/svg+xml;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /data/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
